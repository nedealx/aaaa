<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f2937">
<title>Seif</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--bd:#e5e7eb;--dg:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#e6e8eb;--mut:#9aa3af;--ac:#5b9bff;--bd:#2a313b;--dg:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.center{max-width:380px;margin:12vh auto 0}
h1{font-size:20px;margin:0 0 12px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
label{font-size:13px;color:var(--mut)}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.sec{background:var(--bd);color:var(--tx)}
button.dg{background:var(--dg)}
button.sm{padding:6px 10px;font-size:14px}
button:disabled{opacity:.6}
.menu button{display:block;width:100%;margin:6px 0;text-align:left}
.row{display:flex;gap:8px;align-items:center}
.row>input{margin:0}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0 4px;z-index:5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:16px;background:var(--bd);color:var(--tx);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff}
.chip span{opacity:.7;font-size:12px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.item .t{font-weight:600;cursor:pointer}
.item .u{color:var(--mut);font-size:14px;cursor:pointer}
.tag{background:var(--bd);color:var(--tx);border-radius:10px;padding:1px 8px;font-size:12px;margin-left:4px}
.pill{display:inline-block;background:transparent;color:var(--ac);border:1px solid var(--bd);border-radius:10px;padding:1px 8px;font-size:12px;margin:4px 4px 0 0}
.det{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}
.det div{margin:6px 0;word-break:break-all}
.meta{font-size:13px;color:var(--mut)}
.acc label{display:flex;align-items:center;font-size:14px;color:var(--tx);margin:4px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{font-size:12px;color:var(--mut);text-align:center;margin:8px 0}
.err{color:var(--dg);font-size:14px;min-height:18px}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
.ov .box{width:100%;max-width:480px;margin:4vh 0}
a{color:var(--ac)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:30}
.key{font:15px ui-monospace,monospace;word-break:break-all;background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd)}
.tbl th{font-size:12px;text-align:left;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;user-select:none}
.tbl th[data-act]{cursor:pointer}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top;word-break:break-word}
.tbl tr.row:hover td{background:rgba(127,127,127,.08)}
.tbl tr.detr td{background:rgba(127,127,127,.06)}
.tbl .t{font-weight:600;cursor:pointer}
.tbl .pw{font-family:ui-monospace,monospace;white-space:nowrap}
.tbl .ac{white-space:nowrap;text-align:right}
.tbl .ac button{padding:4px 8px;font-size:14px;margin-left:4px}
.tbl .tag{margin:0}
.detr .det{margin:0;border:0;padding:0}
.sm-only{display:none}
@media(max-width:640px){.hm{display:none}.sm-only{display:inline}.tbl th,.tbl td{padding:8px 6px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Seif multi-utilizator. Pagina nu conține nicio parolă sau configurare personală.
   vault.json (repo privat GitHub): utilizatori (cheie privată criptată cu parola lor),
   categorii și intrări. Fiecare intrare are cheia ei, împachetată separat pentru fiecare
   utilizator care are voie s-o vadă. */

const ITER = 600000, LOCK_MS = 5 * 60 * 1000, CLIP_MS = 30000, MAX_HIST = 30, GENERAL = "general";
const FIELDS = { title: "titlu", url: "adresă", user: "utilizator", pass: "parolă", notes: "note", cat: "categorie", tags: "tag-uri" };
const RSA = { name: "RSA-OAEP", hash: "SHA-256" };

let CFG = null; // { repo, token }
const S = { raw: null, plain: new Map(), meId: null, priv: null, etag: null, text: null,
            online: true, open: null, shown: {}, q: "", cat: "", hist: null, sort: { k: "title", d: 1 } };
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, "0")).join("");
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const fmt = t => t ? new Date(t).toLocaleString("ro-RO", { dateStyle: "short", timeStyle: "short" }) : "—";
const isoLocal = t => t ? new Date(t - new Date(t).getTimezoneOffset() * 60000).toISOString().slice(0, 16).replace("T", " ") : "";

/* ---------- criptare ---------- */
function b64(buf) { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); }
function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function pwKey(pw, saltB64, iter) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function aesSeal(key, bytes) { const iv = rnd(12); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes); return { iv: b64(iv), d: b64(ct) }; }
async function aesOpen(key, o) { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.d))); }
async function wrapPw(bytes, pw) { const salt = b64(rnd(16)); return { salt, iter: ITER, ...(await aesSeal(await pwKey(pw, salt, ITER), bytes)) }; }
async function unwrapPw(w, pw) { return aesOpen(await pwKey(pw, w.salt, w.iter), w); }
const rawKey = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
const newDek = () => crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);

async function newUserKeys(pw) {
  const kp = await crypto.subtle.generateKey({ ...RSA, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["encrypt", "decrypt"]);
  const pub = await crypto.subtle.exportKey("jwk", kp.publicKey);
  const pkcs8 = new Uint8Array(await crypto.subtle.exportKey("pkcs8", kp.privateKey));
  return { pub, pkcs8, w: await wrapPw(pkcs8, pw) };
}
const pubCache = new Map();
async function pubOf(u) {
  if (!pubCache.has(u.pub.n)) pubCache.set(u.pub.n, await crypto.subtle.importKey("jwk", u.pub, RSA, false, ["encrypt"]));
  return pubCache.get(u.pub.n);
}
async function wrapFor(u, rawDek) { return b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, await pubOf(u), rawDek)); }

/* ---------- structura datelor ---------- */
const userById = id => S.raw.users.find(u => u.id === id);
const me = () => S.raw && S.raw.users.find(u => u.id === S.meId && !u.del);
const isAdmin = () => { const m = me(); return !!m && m.role === "admin"; };
const admins = () => S.raw.users.filter(u => u.role === "admin" && !u.del);
const members = () => S.raw.users.filter(u => u.role !== "admin" && !u.del);
const accessFor = id => [...new Set([id, ...admins().map(a => a.id)])];
const canEdit = e => isAdmin() || e.d.createdById === S.meId;
function catList() {
  const l = S.raw.cats.filter(c => !c.del && c.id !== GENERAL).sort((a, b) => a.name.localeCompare(b.name, "ro"));
  return [{ id: GENERAL, name: "General" }, ...l];
}
const catOf = d => catList().some(c => c.id === d.cat) ? d.cat : GENERAL;
const catName = id => (catList().find(c => c.id === id) || { name: "General" }).name;
function visible() {
  return S.raw.entries.filter(r => !r.del && S.plain.has(r.id)).map(r => { const p = S.plain.get(r.id); return { id: r.id, rec: r, p, d: p.data }; });
}
function matches(e, q) {
  const toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const d = e.d, tags = (d.tags || []).map(t => t.toLowerCase());
  const hay = [d.title, d.user, d.url, d.notes, catName(catOf(d)), ...(d.tags || [])].join("\n").toLowerCase();
  return toks.every(t => t[0] === "#" ? (t.length === 1 || tags.some(x => x.startsWith(t.slice(1)))) : hay.includes(t));
}
function parseRaw(t) {
  try { const o = JSON.parse(t); if (o && o.v === 2 && Array.isArray(o.users) && Array.isArray(o.entries)) { o.cats = o.cats || []; return o; } } catch (e) {}
  return null;
}
function mergeBy(a, b) {
  const m = new Map();
  for (const x of [...a, ...b]) { const y = m.get(x.id); if (!y || (x.u || 0) > (y.u || 0)) m.set(x.id, x); }
  return [...m.values()];
}
const mergeRaw = (a, b) => ({ v: 2, users: mergeBy(a.users, b.users), cats: mergeBy(a.cats, b.cats), entries: mergeBy(a.entries, b.entries) });

async function seal(id, data, dek, ids, now, oldK) {
  const s = await aesSeal(dek, enc.encode(JSON.stringify(data)));
  let k = oldK;
  if (!k) {
    const raw = await crypto.subtle.exportKey("raw", dek); k = {};
    for (const x of ids) { const u = userById(x); if (u && !u.del) k[x] = await wrapFor(u, raw); }
  }
  return { id, u: now, k, ...s };
}
async function openRec(rec) {
  const w = rec.k && rec.k[S.meId]; if (!w) return null;
  const raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, S.priv, unb64(w));
  const dek = await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt", "decrypt"]);
  return { u: rec.u, dek, data: JSON.parse(dec.decode(await aesOpen(dek, rec))) };
}
async function syncPlain() {
  const keep = new Map();
  for (const rec of S.raw.entries) {
    if (rec.del || !rec.k || !rec.k[S.meId]) continue;
    const p = S.plain.get(rec.id);
    if (p && p.u === rec.u) { keep.set(rec.id, p); continue; }
    try { const o = await openRec(rec); if (o) keep.set(rec.id, o); } catch (e) { console.error("intrare nedecriptabilă", rec.id, e); }
  }
  S.plain = keep;
}

/* ---------- operații ---------- */
function replaceRec(rec) { const i = S.raw.entries.findIndex(r => r.id === rec.id); if (i >= 0) S.raw.entries[i] = rec; else S.raw.entries.push(rec); }
const same = (a, b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");

async function createVault(name, pw) {
  const now = Date.now(), k = await newUserKeys(pw), rk = rnd(32);
  const admin = { id: uid(), name: name.trim(), role: "admin", pub: k.pub, w: k.w, rec: await aesSeal(await rawKey(rk), k.pkcs8), u: now };
  S.raw = { v: 2, users: [admin], cats: [{ id: GENERAL, name: "General", u: now }], entries: [] };
  S.meId = admin.id; S.plain = new Map();
  S.priv = await crypto.subtle.importKey("pkcs8", k.pkcs8, RSA, false, ["decrypt"]);
  await save();
  return [...rk].map(b => b.toString(16).padStart(2, "0")).join("").replace(/(.{8})(?=.)/g, "$1-");
}
async function doLogin(name, pw) {
  const u = S.raw.users.find(x => !x.del && x.name.toLowerCase() === name.trim().toLowerCase());
  if (!u) throw new Error("login");
  const pkcs8 = await unwrapPw(u.w, pw);
  S.priv = await crypto.subtle.importKey("pkcs8", pkcs8, RSA, false, ["decrypt"]);
  S.meId = u.id; S.plain = new Map();
  await syncPlain();
}
async function recoverAdmin(hex, nw) {
  const h = hex.replace(/[^0-9a-f]/gi, "");
  if (h.length !== 64) throw new Error("Cheia de recuperare are 64 de caractere (cifre și litere a-f).");
  const rk = Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16)));
  const a = admins()[0]; if (!a || !a.rec) throw new Error("Nu există cheie de recuperare.");
  let pkcs8; try { pkcs8 = await aesOpen(await rawKey(rk), a.rec); } catch (e) { throw new Error("Cheie de recuperare greșită."); }
  a.w = await wrapPw(pkcs8, nw); a.u = Date.now();
  S.priv = await crypto.subtle.importKey("pkcs8", pkcs8, RSA, false, ["decrypt"]);
  S.meId = a.id; S.plain = new Map(); await syncPlain(); await save();
}
async function changePw(old, nw) {
  const m = me(); let pk;
  try { pk = await unwrapPw(m.w, old); } catch (e) { throw new Error("Parola actuală e greșită."); }
  m.w = await wrapPw(pk, nw); m.u = Date.now(); await save();
}
async function saveEntry(ex, f) {
  const now = Date.now(), m = me();
  if (ex) {
    const d = ex.d, old = { ...d, cat: catOf(d), tags: d.tags || [] };
    const ch = Object.keys(FIELDS).filter(k => !same(old[k], f[k]));
    if (!ch.length) return false;
    const nd = { ...d, ...f, updated: now, updatedBy: m.name, history: [...(d.history || []), { t: now, by: m.name, f: ch.map(k => FIELDS[k]) }].slice(-MAX_HIST) };
    replaceRec(await seal(ex.id, nd, ex.p.dek, null, now, ex.rec.k));
    S.plain.set(ex.id, { u: now, dek: ex.p.dek, data: nd });
  } else {
    const dek = await newDek(), id = uid();
    const nd = { ...f, created: now, createdBy: m.name, createdById: m.id, updated: now, updatedBy: m.name, history: [{ t: now, by: m.name, f: ["creat"] }] };
    replaceRec(await seal(id, nd, dek, accessFor(m.id), now));
    S.plain.set(id, { u: now, dek, data: nd });
  }
  await save(); return true;
}
async function delEntry(e) {
  const now = Date.now();
  replaceRec({ id: e.id, u: now, del: true }); S.plain.delete(e.id); await save();
}
async function applyAccess(e, ids) {
  const now = Date.now(), m = me(), dek = await newDek();
  const all = [...new Set([...ids, ...admins().map(a => a.id)])];
  const nd = { ...e.d, updated: now, updatedBy: m.name, history: [...(e.d.history || []), { t: now, by: m.name, f: ["acces"] }].slice(-MAX_HIST) };
  replaceRec(await seal(e.id, nd, dek, all, now));
  S.plain.set(e.id, { u: now, dek, data: nd }); await save();
}
async function addUser(name, pw) {
  name = name.trim();
  if (!name) throw new Error("Introdu un nume.");
  if (pw.length < 8) throw new Error("Parola inițială: minim 8 caractere.");
  if (S.raw.users.some(u => !u.del && u.name.toLowerCase() === name.toLowerCase())) throw new Error("Există deja un utilizator cu acest nume.");
  const k = await newUserKeys(pw);
  S.raw.users.push({ id: uid(), name, role: "member", pub: k.pub, w: k.w, u: Date.now() });
  await save();
}
async function resetUser(id, pw) {
  if (pw.length < 8) throw new Error("Minim 8 caractere.");
  const u = userById(id), now = Date.now(), k = await newUserKeys(pw);
  u.pub = k.pub; u.w = k.w; u.u = now;
  for (const rec of S.raw.entries) {
    if (rec.del || !rec.k || !rec.k[id]) continue;
    const p = S.plain.get(rec.id); if (!p) continue;
    rec.k = { ...rec.k, [id]: await wrapFor(u, await crypto.subtle.exportKey("raw", p.dek)) }; rec.u = now; p.u = now;
  }
  await save();
}
async function removeUser(id) {
  const u = userById(id), now = Date.now(); u.del = true; u.u = now;
  for (let i = 0; i < S.raw.entries.length; i++) {
    const rec = S.raw.entries[i]; if (rec.del || !rec.k || !rec.k[id]) continue;
    const p = S.plain.get(rec.id); if (!p) continue;
    const dek = await newDek();
    S.raw.entries[i] = await seal(rec.id, p.data, dek, Object.keys(rec.k).filter(x => x !== id), now);
    S.plain.set(rec.id, { u: now, dek, data: p.data });
  }
  await save();
}
async function addCat(name) {
  name = name.trim();
  if (!name) throw new Error("Introdu un nume.");
  if (catList().some(c => c.name.toLowerCase() === name.toLowerCase())) throw new Error("Categoria există deja.");
  S.raw.cats.push({ id: uid(), name, u: Date.now() }); await save();
}
async function renCat(id, name) {
  name = name.trim();
  if (!name || id === GENERAL) throw new Error("Nume invalid.");
  if (catList().some(c => c.id !== id && c.name.toLowerCase() === name.toLowerCase())) throw new Error("Categoria există deja.");
  const c = S.raw.cats.find(x => x.id === id); c.name = name; c.u = Date.now(); await save();
}
async function delCat(id) {
  if (id === GENERAL) return;
  const c = S.raw.cats.find(x => x.id === id); c.del = true; c.u = Date.now(); await save(); // intrările rămân și trec automat în General
}

/* ---------- GitHub (Contents API) ---------- */
const apiUrl = () => `https://api.github.com/repos/${CFG.repo}/contents/vault.json`;
const hdr = () => ({ Authorization: "Bearer " + CFG.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
function ghErr(r) { return Object.assign(new Error("GitHub " + r.status), { code: r.status }); }
async function remoteGet() {
  const r = await fetch(apiUrl(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw ghErr(r);
  const j = await r.json();
  return { sha: j.sha, text: dec.decode(unb64(String(j.content).replace(/\s/g, ""))) };
}
async function remotePut(text, sha) {
  const body = { message: "update", content: b64(enc.encode(text)) };
  if (sha) body.sha = sha;
  const r = await fetch(apiUrl(), { method: "PUT", headers: { ...hdr(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return { conflict: true };
  if (!r.ok) throw ghErr(r);
  return { sha: (await r.json()).content.sha };
}
const netStatus = e => (e && (e.code === 401 || e.code === 403)) ? "Token respins de GitHub (expirat sau fără drept de scriere)" : null;
async function checkCfg(repo, token) {
  repo = repo.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/, "").replace(/\/$/, ""); token = token.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) throw new Error("Completează repo-ul (utilizator/repo) și token-ul.");
  let r; try { r = await fetch("https://api.github.com/repos/" + repo, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }, cache: "no-store" }); }
  catch (e) { throw new Error("Eroare de rețea."); }
  if (r.status === 401) throw new Error("Token invalid sau expirat.");
  if (r.status === 404) throw new Error("Repo-ul nu e găsit sau token-ul nu are acces la el.");
  if (!r.ok) throw new Error("GitHub a răspuns " + r.status);
  CFG = { repo, token }; localStorage.setItem("gh_cfg", JSON.stringify(CFG));
}

/* ---------- salvare / sincronizare ---------- */
const serialize = () => JSON.stringify(S.raw);
function cacheRaw() { S.text = serialize(); localStorage.setItem("vault2_cache", S.text); }
function status(t) { const e = $("#st"); if (e) e.textContent = t; }
async function save() {
  cacheRaw(); localStorage.setItem("vault2_dirty", "1"); status("Se salvează…");
  try {
    for (let i = 0; i < 4; i++) {
      const r = await remotePut(S.text, S.etag);
      if (!r.conflict) { S.etag = r.sha; localStorage.removeItem("vault2_dirty"); S.online = true; status("Sincronizat ✓"); return; }
      const m = await remoteGet(); S.etag = m ? m.sha : null;
      const rr = m && parseRaw(m.text);
      if (rr) { S.raw = mergeRaw(S.raw, rr); await syncPlain(); }
      cacheRaw(); renderList();
    }
    status("Conflict nerezolvat, încearcă din nou");
  } catch (e) { console.error(e); S.online = false; status(netStatus(e) || "Offline – salvat local, se sincronizează mai târziu"); }
}
async function refresh() {
  if (!S.priv) return;
  try {
    const m = await remoteGet();
    if (m && m.sha !== S.etag) { const r = parseRaw(m.text); if (r) { S.raw = mergeRaw(S.raw, r); S.etag = m.sha; cacheRaw(); } }
    S.online = true;
    if (!me()) return logout("Contul tău a fost eliminat sau schimbat.");
    await syncPlain(); renderList();
    if (localStorage.getItem("vault2_dirty")) await save(); else status("Sincronizat ✓");

async function load() {
  S.raw = null; S.etag = null; S.text = null;
  let remote = null, oldFmt = false;
  try {
    const m = await remoteGet();
    if (m) { S.etag = m.sha; remote = parseRaw(m.text); oldFmt = !remote; }
    S.online = true;
  } catch (e) {
    console.error(e);
    if (e.code === 401) return viewActivate("Token invalid sau expirat. Cere un cod nou de activare de la admin.");
    S.online = false;
  }
  const cache = parseRaw(localStorage.getItem("vault2_cache")), dirty = !!localStorage.getItem("vault2_dirty");
  if (remote) S.raw = (cache && dirty) ? mergeRaw(remote, cache) : remote;
  else if (!S.online) S.raw = cache;
  if (!S.raw) return S.online ? viewSetup(oldFmt) : viewMsg("Nu pot contacta GitHub și nu există copie locală.");
  cacheRaw(); viewLogin();
}
async function init() {
  setManifest();
  try { CFG = JSON.parse(localStorage.getItem("gh_cfg") || "null"); } catch (e) { CFG = null; }
  if (!CFG || !CFG.repo || !CFG.token) return viewActivate();
  await load();
}

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;

  const card = b.closest("[data-id]"); const e = card && visible().find(x => x.id === card.dataset.id);
  if (!e) return;

  else if (act === "cu") copy(e.d.user, "User copiat");

  else if (act === "edit" && canEdit(e)) openEdit(e);

  if (clear) setTimeout(() => navigator.clipboard.writeText(" ").catch(() => {}), CLIP_MS);

function genPass(n = 20) {
  const cs = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+";
  const lim = 256 - (256 % cs.length); let out = "";
  while (out.length < n) for (const v of crypto.getRandomValues(new Uint8Array(32))) { if (v < lim && out.length < n) out += cs[v % cs.length]; }
  return out;
}

  <div class="row"><input id="n_p" autocomplete="off"><button class="sec" id="n_g" type="button">Generează</button></div>
  <div class="err" id="n_e"></div><div class="row"><button id="n_a">Adaugă</button><button class="sec" id="n_x">Închide</button></div>`);
  $("#n_x").onclick = () => o.remove();
  $("#n_g").onclick = () => { $("#n_p").value = genPass(14); };
  $("#n_a").onclick = () => busy($("#n_a"), $("#n_e"), async () => {
    const n = $("#n_n").value, p = $("#n_p").value; $("#n_a").textContent = "Se creează…";
    await addUser(n, p); o.remove(); toast(`Utilizator creat. Parola inițială: ${p}`); openUsers();
  }).then(ok => { if (!ok) $("#n_a").textContent = "Adaugă"; });
  o.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => {
    const u = userById(b.dataset.r), p = prompt(`Parolă nouă pentru ${u.name} (minim 8 caractere):`, genPass(14));
    if (!p) return; b.disabled = true;
    try { await resetUser(u.id, p); toast(`Parolă resetată pentru ${u.name}`); } catch (e) { alert(e.message); }
    b.disabled = false;
  });
  o.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    const u = userById(b.dataset.d);
    if (!confirm(`Ștergi utilizatorul ${u.name}? Pierde accesul la toate parolele.`)) return;
    b.disabled = true; try { await removeUser(u.id); o.remove(); openUsers(); renderList(); } catch (e) { alert(e.message); b.disabled = false; }
  });
}
function openCats() {
  const counts = new Map(); for (const e of visible()) { const c = catOf(e.d); counts.set(c, (counts.get(c) || 0) + 1); }
  const o = modal(`<h1>Categorii</h1>
  ${catList().map(c => `<div class="item"><b>${esc(c.name)}</b> <span class="meta">${counts.get(c.id) || 0} intrări</span>
    ${c.id === GENERAL ? '<div class="meta">Categorie implicită, nu poate fi ștearsă.</div>' : `<div class="acts"><button class="sm sec" data-rn="${c.id}">Redenumește</button><button class="sm dg" data-dc="${c.id}">Șterge</button></div>`}</div>`).join("")}
  <h1 style="margin-top:16px">Adaugă categorie</h1>
  <input id="k_n" autocomplete="off" maxlength="40" placeholder="Nume categorie">
  <div class="err" id="k_e"></div><div class="row"><button id="k_a">Adaugă</button><button class="sec" id="k_x">Închide</button></div>`);
  $("#k_x").onclick = () => o.remove();
  const again = () => { o.remove(); openCats(); renderList(); };
  $("#k_a").onclick = () => busy($("#k_a"), $("#k_e"), async () => { await addCat($("#k_n").value); again(); });
  o.querySelectorAll("[data-rn]").forEach(b => b.onclick = async () => {
    const c = catList().find(x => x.id === b.dataset.rn), n = prompt("Nume nou:", c.name); if (!n) return;
    try { await renCat(c.id, n); again(); } catch (e) { alert(e.message); }
  });
  o.querySelectorAll("[data-dc]").forEach(b => b.onclick = async () => {
    const c = catList().find(x => x.id === b.dataset.dc), n = counts.get(c.id) || 0;
    if (!confirm(`Ștergi categoria „${c.name}”?${n ? ` Cele ${n} intrări rămân și trec în General.` : ""}`)) return;
    try { await delCat(c.id); again(); } catch (e) { alert(e.message); }
  });
}
function openConn() {
  const code = btoa(JSON.stringify({ r: CFG.repo, t: CFG.token }));
  const o = modal(`<h1>Conexiune GitHub</h1>
  <label>Repo de date</label><input id="g_r" value="${esc(CFG.repo)}" autocapitalize="off" autocomplete="off">
  <label>Token nou (lasă gol ca să păstrezi token-ul actual)</label><input id="g_t" type="password" autocomplete="off" placeholder="github_pat_...">
  <div class="err" id="g_e"></div><button id="g_s">Salvează conexiunea</button>
  <h1 style="margin-top:18px">Cod de activare</h1>
  <p class="meta">Membrii îl lipesc o singură dată pe un dispozitiv nou, înainte de autentificare. Conține token-ul: trimite-l doar pe un canal sigur.</p>
  <textarea id="g_c" rows="3" readonly>${esc(code)}</textarea>
  <div class="row"><button class="sec" id="g_cp">Copiază codul</button><button class="sec" id="g_x">Închide</button></div>`);
  $("#g_x").onclick = () => o.remove();
  $("#g_cp").onclick = () => copy(code, "Cod copiat");
  $("#g_s").onclick = () => busy($("#g_s"), $("#g_e"), async () => {
    const old = { ...CFG };
    try { await checkCfg($("#g_r").value, $("#g_t").value.trim() || old.token); }
    catch (e) { CFG = old; throw e; }
    o.remove(); toast("Conexiune salvată"); refresh();
  });
}

/* ---------- export CSV ---------- */
function buildCsv(sep) {
  const adm = isAdmin();
  const head = ["categorie", "tag-uri", "titlu", "adresa", "utilizator", "parola", "note", "creat_de", "creat_la", "modificat_de", "modificat_la", ...(adm ? ["vizibil_pentru"] : [])];
  const rows = visible().sort((a, b) => catName(catOf(a.d)).localeCompare(catName(catOf(b.d)), "ro") || (a.d.title || "").localeCompare(b.d.title || "", "ro"))
    .map(e => { const d = e.d; return [catName(catOf(d)), (d.tags || []).join(" "), d.title, d.url, d.user, d.pass, d.notes, d.createdBy, isoLocal(d.created), d.updatedBy, isoLocal(d.updated),
      ...(adm ? [Object.keys(e.rec.k).map(i => (userById(i) || { name: "?" }).name).join(" / ")] : [])]; });
  const cell = v => { const s = String(v ?? ""); return (s.includes(sep) || /["\r\n]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return "﻿" + [head, ...rows].map(r => r.map(cell).join(sep)).join("\r\n") + "\r\n";
}
function openExport() {
  const o = modal(`<h1>Export CSV</h1>
  <p class="err" style="min-height:0">Fișierul conține parolele ${isAdmin() ? "tuturor intrărilor" : "pe care le vezi"} în clar. Păstrează-l într-un loc sigur și șterge-l după folosire.</p>
  <label>Separator</label><select id="x_sep"><option value=";">punct și virgulă (Excel în română)</option><option value=",">virgulă (standard)</option></select>
  <label>Confirmă parola ta</label><input id="x_pw" type="password" autocomplete="current-password">
  <div class="err" id="x_e"></div><div class="row"><button id="x_go">Descarcă CSV</button><button class="sec" id="x_c">Anulează</button></div>`);
  $("#x_c").onclick = () => o.remove();
  const go = () => busy($("#x_go"), $("#x_e"), async () => {
    try { await unwrapPw(me().w, $("#x_pw").value); } catch (e) { throw new Error("Parolă greșită."); }
    const blob = new Blob([buildCsv($("#x_sep").value)], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "seif-" + isoLocal(Date.now()).slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    o.remove(); toast("CSV descărcat");
  });
  $("#x_go").onclick = go; $("#x_pw").onkeydown = e => { if (e.key === "Enter") go(); };
  $("#x_pw").focus();
}

/* ---------- blocare automată ---------- */
let lockTimer, hiddenAt = 0;
function armLock() { clearTimeout(lockTimer); if (S.priv) lockTimer = setTimeout(() => logout(), LOCK_MS); }
["click", "keydown", "touchstart", "mousemove"].forEach(ev => addEventListener(ev, armLock, { passive: true }));
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (S.priv) { if (Date.now() - hiddenAt > LOCK_MS) logout(); else refresh(); }
});
addEventListener("online", () => { if (S.priv) refresh(); });

init();
</script>
