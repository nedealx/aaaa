<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Vault</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#000;--mut:#666;--bd:#d9d9d9;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#0a0a0a;--tx:#fff;--mut:#9b9b9b;--bd:#2e2e2e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--tx);text-decoration:underline}
.ic{flex:none;pointer-events:none}
.wrap{max-width:1280px;margin:0 auto;padding:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin:12px 0}
.center{max-width:380px;margin:12vh auto 0}
h1{font-size:18px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--tx)}
input[type=checkbox]{width:16px;height:16px;margin:0 8px 0 0;accent-color:var(--tx)}
label{font-size:13px;color:var(--mut)}
button{padding:9px 14px;border:1px solid var(--tx);border-radius:8px;background:var(--tx);color:var(--bg);font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.sec{background:transparent;color:var(--tx);border-color:var(--bd)}
button.sec:hover{border-color:var(--tx)}
button:disabled{opacity:.5;cursor:default}
button.sm{padding:6px 10px;font-size:14px}
.ib{width:34px;height:34px;padding:0;flex:none}
.ico{width:26px;height:26px;padding:0;border:0;background:transparent;color:var(--mut);border-radius:6px;flex:none}
.ico:hover{color:var(--tx);background:var(--bd)}
.menu button{width:100%;margin:6px 0;justify-content:flex-start}
.row{display:flex;gap:8px;align-items:center}
.row>input{margin:0}
.sw{position:relative;flex:1;min-width:0}
.sw input{margin:0;padding-right:36px}
.clr{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.sw.has .clr,.sw input:not(:placeholder-shown)~.clr{display:inline-flex}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0 4px;z-index:5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:16px;background:transparent;color:var(--tx);border:1px solid var(--bd);font-size:14px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip span{opacity:.6;font-size:12px}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:10px;padding:1px 8px;font-size:12px;white-space:nowrap}
.pill{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;padding:1px 8px;font-size:12px;flex:none}
.pill:hover{border-color:var(--tx)}
.meta{font-size:13px;color:var(--mut)}
.st{font-size:12px;color:var(--mut);text-align:center;margin:8px 0;display:flex;gap:6px;align-items:center;justify-content:center}
.err{color:var(--tx);font-weight:600;font-size:14px;min-height:18px}
.warn{font-size:14px;font-weight:600}
.key{font:15px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;border:1px dashed var(--tx);border-radius:8px;padding:12px;margin:10px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
.ov .box{width:100%;max-width:480px;margin:4vh 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:30}
/* list */
.lst{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.lh,.li{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr) minmax(0,2.2fr) minmax(0,1.8fr) 118px;column-gap:14px;align-items:center}
.lh{padding:8px 14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--bd);user-select:none;text-transform:uppercase;letter-spacing:.04em}
.lh>div[data-act]{cursor:pointer}
.lh>div[data-act]:hover{color:var(--tx)}
.li{padding:9px 14px;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.li:hover{background:rgba(128,128,128,.07)}
.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.li .t{font-weight:600;cursor:pointer}
.c-u,.c-p{display:flex;align-items:center;gap:2px;min-width:0;flex-wrap:nowrap}
.c-u .un,.c-p .pw{flex:0 1 auto}
.pw{font-family:ui-monospace,Menlo,Consolas,monospace}
.ztags{display:flex;flex-wrap:wrap;gap:6px}
.c-a{display:flex;gap:4px;justify-content:flex-end}
.c-d{grid-column:1/-1;margin-top:12px}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.zcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.zcol .zone{flex:1 1 0}
.z-notes{display:flex;flex-direction:column}
.z-notes .zb{flex:1 1 auto;min-height:0;max-height:320px;overflow:auto}
.zone{border:1px solid var(--bd);border-radius:8px;padding:12px;min-width:0}
.zh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.zb{word-break:break-word;white-space:pre-wrap}
.zone a{display:inline-flex;align-items:center;gap:6px;word-break:break-all}
.none{color:var(--mut)}
.acc label{display:flex;align-items:center;font-size:14px;color:var(--tx);margin:6px 0}
.foot{margin-top:10px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.foot a{display:inline-flex;align-items:center;gap:6px;color:var(--tx);cursor:pointer}
.hist{font-size:13px;color:var(--mut);margin-top:8px}
.sm-only{display:none}
@media(max-width:700px){
  .lh,.hm{display:none}.sm-only{display:inline-block}
  .li{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t a" "u u" "p p";row-gap:4px}
  .li .c-t{grid-area:t}.li .c-a{grid-area:a}
  .li .c-u{grid-area:u;font-size:14px;color:var(--mut)}.li .c-p{grid-area:p;font-size:14px}
  .zones{grid-template-columns:1fr}
  .zcol .zone{flex:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Multi-user vault. The page contains no passwords and no personal configuration.
   vault.json (private GitHub repo): users (private key encrypted with their password),
   categories and entries. Every entry has its own key, wrapped separately for each
   user who may see it. */

const ITER = 600000, LOCK_MS = 5 * 60 * 1000, CLIP_MS = 30000, MAX_HIST = 30, GENERAL = "general";
const FIELDS = { title: "title", url: "URL", user: "username", pass: "password", notes: "notes", cat: "category", tags: "tags" };
const LEGACY = { "creat": "created", "șters": "deleted", "acces": "access", "titlu": "title", "adresă": "URL", "utilizator": "username", "parolă": "password", "note": "notes", "categorie": "category", "tag-uri": "tags" };
const RSA = { name: "RSA-OAEP", hash: "SHA-256" };

/* ---------- line icons (Feather style) ---------- */
const P = {
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  "eye-off": '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
  edit: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
  down: '<polyline points="6 9 12 15 18 9"/>',
  up: '<polyline points="18 15 12 9 6 15"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  note: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  ext: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
  tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'
};
const ic = (n, s = 16) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const ibtn = (n, act, title, extra = "") => `<button class="ib sec" data-act="${act}" title="${title}" aria-label="${title}" ${extra}>${ic(n)}</button>`;
const ico = (n, act, title) => `<button class="ico" data-act="${act}" title="${title}" aria-label="${title}">${ic(n, 15)}</button>`;

let CFG = null; // { repo, token }
const S = { raw: null, plain: new Map(), meId: null, priv: null, etag: null, text: null,
            online: true, open: null, shown: {}, q: "", cat: "", hist: null, sort: { k: "title", d: 1 } };
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, "0")).join("");
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const cmp = (a, b) => String(a).localeCompare(String(b), "en");
const fmt = t => t ? new Date(t).toLocaleString("en-GB", { dateStyle: "short", timeStyle: "short" }) : "—";
const isoLocal = t => t ? new Date(t - new Date(t).getTimezoneOffset() * 60000).toISOString().slice(0, 16).replace("T", " ") : "";

/* ---------- crypto ---------- */
function b64(buf) { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); }
function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function pwKey(pw, saltB64, iter) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function aesSeal(key, bytes) { const iv = rnd(12); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes); return { iv: b64(iv), d: b64(ct) }; }
async function aesOpen(key, o) { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.d))); }
async function wrapPw(bytes, pw) { const salt = b64(rnd(16)); return { salt, iter: ITER, ...(await aesSeal(await pwKey(pw, salt, ITER), bytes)) }; }
async function unwrapPw(w, pw) { return aesOpen(await pwKey(pw, w.salt, w.iter), w); }
const rawKey = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
const newDek = () => crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);

async function newUserKeys(pw) {
  const kp = await crypto.subtle.generateKey({ ...RSA, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["encrypt", "decrypt"]);
  const pub = await crypto.subtle.exportKey("jwk", kp.publicKey);
  const pkcs8 = new Uint8Array(await crypto.subtle.exportKey("pkcs8", kp.privateKey));
  return { pub, pkcs8, w: await wrapPw(pkcs8, pw) };
}
const pubCache = new Map();
async function pubOf(u) {
  if (!pubCache.has(u.pub.n)) pubCache.set(u.pub.n, await crypto.subtle.importKey("jwk", u.pub, RSA, false, ["encrypt"]));
  return pubCache.get(u.pub.n);
}
async function wrapFor(u, rawDek) { return b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, await pubOf(u), rawDek)); }

/* ---------- data model ---------- */
const isEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function checkUnique(name, email, exceptId) {
  const live = S.raw.users.filter(u => !u.del && u.id !== exceptId);
  if (live.some(u => u.name.toLowerCase() === name.toLowerCase())) throw new Error("A user with this name already exists.");
  if (live.some(u => (u.email || "").toLowerCase() === email.toLowerCase())) throw new Error("A user with this email already exists.");
}
const userById = id => S.raw.users.find(u => u.id === id);
const me = () => S.raw && S.raw.users.find(u => u.id === S.meId && !u.del);
const isAdmin = () => { const m = me(); return !!m && m.role === "admin"; };
const admins = () => S.raw.users.filter(u => u.role === "admin" && !u.del);
const members = () => S.raw.users.filter(u => u.role !== "admin" && !u.del);
const accessFor = id => [...new Set([id, ...admins().map(a => a.id)])];
const canEdit = e => isAdmin() || e.d.createdById === S.meId;
function catList() {
  const l = S.raw.cats.filter(c => !c.del && c.id !== GENERAL).sort((a, b) => cmp(a.name, b.name));
  return [{ id: GENERAL, name: "General" }, ...l];
}
const catOf = d => catList().some(c => c.id === d.cat) ? d.cat : GENERAL;
const catName = id => (catList().find(c => c.id === id) || { name: "General" }).name;
function visible() {
  return S.raw.entries.filter(r => !r.del && S.plain.has(r.id)).map(r => { const p = S.plain.get(r.id); return { id: r.id, rec: r, p, d: p.data }; });
}
function matches(e, q) {
  const toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const d = e.d, tags = (d.tags || []).map(t => t.toLowerCase());
  const hay = [d.title, d.user, d.url, d.notes, catName(catOf(d)), ...(d.tags || [])].join("\n").toLowerCase();
  return toks.every(t => t[0] === "#" ? (t.length === 1 || tags.some(x => x.startsWith(t.slice(1)))) : hay.includes(t));
}
function parseRaw(t) {
  try { const o = JSON.parse(t); if (o && o.v === 2 && Array.isArray(o.users) && Array.isArray(o.entries)) { o.cats = o.cats || []; return o; } } catch (e) {}
  return null;
}
function mergeBy(a, b) {
  const m = new Map();
  for (const x of [...a, ...b]) { const y = m.get(x.id); if (!y || (x.u || 0) > (y.u || 0)) m.set(x.id, x); }
  return [...m.values()];
}
const mergeRaw = (a, b) => ({ v: 2, users: mergeBy(a.users, b.users), cats: mergeBy(a.cats, b.cats), entries: mergeBy(a.entries, b.entries) });

async function seal(id, data, dek, ids, now, oldK) {
  const s = await aesSeal(dek, enc.encode(JSON.stringify(data)));
  let k = oldK;
  if (!k) {
    const raw = await crypto.subtle.exportKey("raw", dek); k = {};
    for (const x of ids) { const u = userById(x); if (u && !u.del) k[x] = await wrapFor(u, raw); }
  }
  return { id, u: now, k, ...s };
}
async function openRec(rec) {
  const w = rec.k && rec.k[S.meId]; if (!w) return null;
  const raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, S.priv, unb64(w));
  const dek = await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt", "decrypt"]);
  return { u: rec.u, dek, data: JSON.parse(dec.decode(await aesOpen(dek, rec))) };
}
async function syncPlain() {
  const keep = new Map();
  for (const rec of S.raw.entries) {
    if (rec.del || !rec.k || !rec.k[S.meId]) continue;
    const p = S.plain.get(rec.id);
    if (p && p.u === rec.u) { keep.set(rec.id, p); continue; }
    try { const o = await openRec(rec); if (o) keep.set(rec.id, o); } catch (e) { console.error("undecryptable entry", rec.id, e); }
  }
  S.plain = keep;
}

/* ---------- operations ---------- */
function replaceRec(rec) { const i = S.raw.entries.findIndex(r => r.id === rec.id); if (i >= 0) S.raw.entries[i] = rec; else S.raw.entries.push(rec); }
const same = (a, b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");

async function createVault(name, email, pw) {
  const now = Date.now(), k = await newUserKeys(pw), rk = rnd(32);
  const admin = { id: uid(), name: name.trim(), email: email.trim(), role: "admin", pub: k.pub, w: k.w, rec: await aesSeal(await rawKey(rk), k.pkcs8), u: now };
  S.raw = { v: 2, users: [admin], cats: [{ id: GENERAL, name: "General", u: now }], entries: [] };
  S.meId = admin.id; S.plain = new Map();
  S.priv = await crypto.subtle.importKey("pkcs8", k.pkcs8, RSA, false, ["decrypt"]);
  await save();
  return [...rk].map(b => b.toString(16).padStart(2, "0")).join("").replace(/(.{8})(?=.)/g, "$1-");
}
async function doLogin(name, pw) {
  const q = name.trim().toLowerCase(), live = S.raw.users.filter(x => !x.del);
  const u = live.find(x => x.name.toLowerCase() === q) || live.find(x => (x.email || "").toLowerCase() === q);
  if (!u) throw new Error("login");
  const pkcs8 = await unwrapPw(u.w, pw);
  S.priv = await crypto.subtle.importKey("pkcs8", pkcs8, RSA, false, ["decrypt"]);
  S.meId = u.id; S.plain = new Map();
  await syncPlain();
}
async function recoverAdmin(hex, nw) {
  const h = hex.replace(/[^0-9a-f]/gi, "");
  if (h.length !== 64) throw new Error("The recovery key has 64 characters (digits and letters a–f).");
  const rk = Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16)));
  const a = admins()[0]; if (!a || !a.rec) throw new Error("There is no recovery key.");
  let pkcs8; try { pkcs8 = await aesOpen(await rawKey(rk), a.rec); } catch (e) { throw new Error("Wrong recovery key."); }
  a.w = await wrapPw(pkcs8, nw); a.u = Date.now();
  S.priv = await crypto.subtle.importKey("pkcs8", pkcs8, RSA, false, ["decrypt"]);
  S.meId = a.id; S.plain = new Map(); await syncPlain(); await save();
}
async function changePw(old, nw) {
  const m = me(); let pk;
  try { pk = await unwrapPw(m.w, old); } catch (e) { throw new Error("Current password is wrong."); }
  m.w = await wrapPw(pk, nw); m.u = Date.now(); await save();
}
async function saveEntry(ex, f) {
  const now = Date.now(), m = me();
  if (ex) {
    const d = ex.d, old = { ...d, cat: catOf(d), tags: d.tags || [] };
    const ch = Object.keys(FIELDS).filter(k => !same(old[k], f[k]));
    if (!ch.length) return false;
    const nd = { ...d, ...f, updated: now, updatedBy: m.name, history: [...(d.history || []), { t: now, by: m.name, f: ch.map(k => FIELDS[k]) }].slice(-MAX_HIST) };
    replaceRec(await seal(ex.id, nd, ex.p.dek, null, now, ex.rec.k));
    S.plain.set(ex.id, { u: now, dek: ex.p.dek, data: nd });
  } else {
    const dek = await newDek(), id = uid();
    const nd = { ...f, created: now, createdBy: m.name, createdById: m.id, updated: now, updatedBy: m.name, history: [{ t: now, by: m.name, f: ["created"] }] };
    replaceRec(await seal(id, nd, dek, accessFor(m.id), now));

  await save(); return true;
}

/* ---------- GitHub (Contents API) ---------- */
const apiUrl = () => `https://api.github.com/repos/${CFG.repo}/contents/vault.json`;
const hdr = () => ({ Authorization: "Bearer " + CFG.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
function ghErr(r) { return Object.assign(new Error("GitHub " + r.status), { code: r.status }); }
async function remoteGet() {
  const r = await fetch(apiUrl(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw ghErr(r);
  const j = await r.json();
  return { sha: j.sha, text: dec.decode(unb64(String(j.content).replace(/\s/g, ""))) };
}
async function remotePut(text, sha) {
  const body = { message: "update", content: b64(enc.encode(text)) };
  if (sha) body.sha = sha;
  const r = await fetch(apiUrl(), { method: "PUT", headers: { ...hdr(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return { conflict: true };
  if (!r.ok) throw ghErr(r);
  return { sha: (await r.json()).content.sha };
}
const netStatus = e => (e && (e.code === 401 || e.code === 403)) ? "Token rejected by GitHub (expired or no write permission)" : null;
async function checkCfg(repo, token) {
  repo = repo.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/, "").replace(/\/$/, ""); token = token.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) throw new Error("Fill in the repo (user/repo) and the token.");
  let r; try { r = await fetch("https://api.github.com/repos/" + repo, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }, cache: "no-store" }); }
  catch (e) { throw new Error("Network error."); }
  if (r.status === 401) throw new Error("Invalid or expired token.");
  if (r.status === 404) throw new Error("Repo not found, or the token has no access to it.");
  if (!r.ok) throw new Error("GitHub responded " + r.status);
  CFG = { repo, token }; localStorage.setItem("gh_cfg", JSON.stringify(CFG));
}

/* ---------- save / sync ---------- */
const serialize = () => JSON.stringify(S.raw);
function cacheRaw() { S.text = serialize(); localStorage.setItem("vault2_cache", S.text); }
function status(t) { const e = $("#st"); if (e) e.textContent = t; }
async function save() {
  cacheRaw(); localStorage.setItem("vault2_dirty", "1"); status("Saving…");
  try {
    for (let i = 0; i < 4; i++) {
      const r = await remotePut(S.text, S.etag);
      if (!r.conflict) { S.etag = r.sha; localStorage.removeItem("vault2_dirty"); S.online = true; status("Synced"); return; }
      const m = await remoteGet(); S.etag = m ? m.sha : null;
      const rr = m && parseRaw(m.text);
      if (rr) { S.raw = mergeRaw(S.raw, rr); await syncPlain(); }
      cacheRaw(); renderList();
    }
    status("Conflict not resolved, try again");
  } catch (e) { console.error(e); S.online = false; status(netStatus(e) || "Offline – saved locally, will sync later"); }
}
async function refresh() {
  if (!S.priv) return;
  try {
    const m = await remoteGet();
    if (m && m.sha !== S.etag) { const r = parseRaw(m.text); if (r) { S.raw = mergeRaw(S.raw, r); S.etag = m.sha; cacheRaw(); } }
    S.online = true;
    if (!me()) return logout("Your account was removed or changed.");
    await syncPlain(); renderList();
    if (localStorage.getItem("vault2_dirty")) await save(); else status("Synced");
  } catch (e) { console.error(e); S.online = false; status(netStatus(e) || "Offline"); }
}

/* ---------- startup ---------- */
async function load() {
  S.raw = null; S.etag = null; S.text = null;
  let remote = null, oldFmt = false;
  try {
    const m = await remoteGet();
    if (m) { S.etag = m.sha; remote = parseRaw(m.text); oldFmt = !remote; }
    S.online = true;
  } catch (e) {
    console.error(e);
    if (e.code === 401) return viewActivate("Invalid or expired token. Ask the admin for a new activation code.");
    S.online = false;
  }
  const cache = parseRaw(localStorage.getItem("vault2_cache")), dirty = !!localStorage.getItem("vault2_dirty");
  if (remote) S.raw = (cache && dirty) ? mergeRaw(remote, cache) : remote;
  else if (!S.online) S.raw = cache;
  if (!S.raw) return S.online ? viewSetup(oldFmt) : viewMsg("Cannot reach GitHub and there is no local copy.");
  cacheRaw(); viewLogin();
}
async function init() {
  setManifest();
  try { CFG = JSON.parse(localStorage.getItem("gh_cfg") || "null"); } catch (e) { CFG = null; }
  if (!CFG || !CFG.repo || !CFG.token) return viewActivate();
  await load();
}
function setManifest() {
  const icon = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#000"/><rect x="136" y="236" width="240" height="180" rx="24" fill="#fff"/><path d="M186 236v-50a70 70 0 0 1 140 0v50" fill="none" stroke="#fff" stroke-width="32"/><circle cx="256" cy="320" r="24" fill="#000"/></svg>');
  const man = { name: "Vault", short_name: "Vault", start_url: location.pathname, display: "standalone", background_color: "#000000", theme_color: "#000000",
    icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" }] };
  const l = document.createElement("link"); l.rel = "manifest";
  l.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(man));

  const card = b.closest("[data-id]"); const e = card && visible().find(x => x.id === card.dataset.id);
  if (!e) return;
  if (act === "toggle") { S.open = S.open === e.id ? null : e.id; renderList(); }
  else if (act === "show") { S.shown[e.id] = !S.shown[e.id]; renderList(); }
  else if (act === "hist") { S.hist = S.hist === e.id ? null : e.id; renderList(); }
  else if (act === "cu") copy(e.d.user, "Username copied");
  else if (act === "cp") copy(e.d.pass, "Password copied (cleared in 30 s)", true);
  else if (act === "edit" && canEdit(e)) openEdit(e);
  else if (act === "del" && canEdit(e)) { if (confirm(`Delete "${e.d.title}"?`)) { await delEntry(e); renderList(); } }
  else if (act === "acc" && isAdmin()) {
    const ids = [...card.querySelectorAll("input[data-uid]:checked")].map(i => i.dataset.uid);
    b.disabled = true; try { await applyAccess(e, ids); toast("Access updated"); } catch (er) { console.error(er); toast("Error"); }
    renderList();
  }
});
async function copy(t, msg, clear) {
  try { await navigator.clipboard.writeText(t || ""); toast(msg); } catch (e) { toast("Could not copy"); return; }
  if (clear) setTimeout(() => navigator.clipboard.writeText(" ").catch(() => {}), CLIP_MS);
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function modal(html) { const o = document.createElement("div"); o.className = "ov"; o.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(o); return o; }
function genPass(n = 20) {
  const cs = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+";
  const lim = 256 - (256 % cs.length); let out = "";
  while (out.length < n) for (const v of crypto.getRandomValues(new Uint8Array(32))) { if (v < lim && out.length < n) out += cs[v % cs.length]; }
  return out;
}
const parseTags = s => { const seen = new Set(), out = []; for (const t of s.split(",").map(x => x.trim().replace(/^#/, "")).filter(Boolean)) { if (!seen.has(t.toLowerCase())) { seen.add(t.toLowerCase()); out.push(t); } } return out; };

/* ---------- add / edit entry ---------- */
function openEdit(e) {
  const d = e ? e.d : {};
  const o = modal(`<h1>${e ? "Edit entry" : "Add entry"}</h1>
  <label>Title / site</label><input id="f_t" value="${esc(d.title)}">
  <label>Category</label><select id="f_cat">${catList().map(c => `<option value="${esc(c.id)}"${c.id === (e ? catOf(d) : (S.cat || GENERAL)) ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
  <label>Tags (comma separated)</label><input id="f_tags" value="${esc((d.tags || []).join(", "))}" autocomplete="off" autocapitalize="off">
  <label>URL (optional)</label><input id="f_url" value="${esc(d.url)}">
  <label>Username</label><input id="f_u" value="${esc(d.user)}" autocomplete="off">
  <label>Password</label><div class="row"><input id="f_p" value="${esc(d.pass)}" autocomplete="off"><button class="sec" id="f_g" type="button">Generate</button></div>
  <label style="display:block;margin-top:10px">Notes</label><textarea id="f_n" rows="3">${esc(d.notes)}</textarea>
  <div class="err" id="f_e"></div>
  <div class="row"><button id="f_s">Save</button><button class="sec" id="f_c">Cancel</button></div>`);
  $("#f_g").onclick = () => { $("#f_p").value = genPass(); };
  $("#f_c").onclick = () => o.remove();
  $("#f_s").onclick = async () => {
    const t = $("#f_t").value.trim(); if (!t) return $("#f_t").focus();

    $("#f_s").disabled = true;
    try { await saveEntry(e, f); o.remove(); renderList(); } catch (er) { console.error(er); $("#f_e").textContent = "Error while saving."; $("#f_s").disabled = false; }
  };
  $("#f_t").focus();
}

/* ---------- menu ---------- */
function openMenu() {
  const o = modal(`<h1>${ic("user", 18)} ${esc(me().name)} <span class="meta">${isAdmin() ? "admin" : "member"}</span></h1><div class="menu">
    <button class="sec" id="m_pf">My profile</button>
    <button class="sec" id="m_pw">Change my password</button>
    <button class="sec" id="m_ex">Export CSV</button>
    ${isAdmin() ? `<button class="sec" id="m_us">Users</button><button class="sec" id="m_ct">Categories</button><button class="sec" id="m_cn">GitHub connection</button>` : ""}
    <button class="sec" id="m_lo">Sign out</button><button class="sec" id="m_x">Close</button></div>`);
  const go = (id, fn) => { $(id).onclick = () => { o.remove(); fn(); }; };
  go("#m_pf", () => openProfile(S.meId)); go("#m_pw", openChangePw); go("#m_ex", openExport); go("#m_lo", () => logout());
  if (isAdmin()) { go("#m_us", openUsers); go("#m_ct", openCats); go("#m_cn", openConn); }
  $("#m_x").onclick = () => o.remove();
}
async function busy(btn, errEl, fn) {
  btn.disabled = true; errEl.textContent = "";
  try { await fn(); return true; } catch (e) { errEl.textContent = e.message || "Error."; btn.disabled = false; return false; }
}
function openChangePw() {
  const o = modal(`<h1>Change password</h1>
  <label>Current password</label><input id="w_o" type="password" autocomplete="current-password">
  <label>New password (at least 10 characters)</label><input id="w_n" type="password" autocomplete="new-password">
  <label>Repeat new password</label><input id="w_r" type="password" autocomplete="new-password">
  <div class="err" id="w_e"></div><div class="row"><button id="w_s">Save</button><button class="sec" id="w_c">Cancel</button></div>`);
  $("#w_c").onclick = () => o.remove();
  $("#w_s").onclick = () => busy($("#w_s"), $("#w_e"), async () => {
    if ($("#w_n").value.length < 10) throw new Error("At least 10 characters.");
    if ($("#w_n").value !== $("#w_r").value) throw new Error("The new passwords do not match.");
    await changePw($("#w_o").value, $("#w_n").value); o.remove(); toast("Password changed");
  });
}
function openProfile(id) {
  const u = userById(id), self = id === S.meId;
  const o = modal(`<h1>${self ? "My profile" : "Edit user"}</h1>
  <label>Name (shown in the app)</label><input id="u_n" value="${esc(u.name)}" maxlength="30" autocomplete="off">
  <label>Email</label><input id="u_e" type="email" value="${esc(u.email)}" autocomplete="off" autocapitalize="off">
  <p class="meta">Only the name is shown in the app. The email is visible only to admins and in the profile, and can also be used to sign in.</p>
  <div class="err" id="u_x"></div><div class="row"><button id="u_s">Save</button><button class="sec" id="u_c">Cancel</button></div>`);
  $("#u_c").onclick = () => { o.remove(); if (!self) openUsers(); };
  $("#u_s").onclick = () => busy($("#u_s"), $("#u_x"), async () => {
    await updateProfile(id, $("#u_n").value, $("#u_e").value);
    o.remove(); toast("Profile saved");
    if (self) { localStorage.setItem("vault_last", me().name); const w = $("#who"); if (w) w.innerHTML = `${ic("user", 14)} ${esc(me().name)} · ${isAdmin() ? "admin" : "member"}`; }
    renderList(); if (!self) openUsers();
  });
}
function openRecover() {
  const o = modal(`<h1>Admin recovery</h1>
  <p class="meta">Enter the recovery key you wrote down when the vault was created and choose a new admin password.</p>
  <label>Recovery key</label><input id="r_k" autocomplete="off" spellcheck="false">
  <label>New password (at least 10 characters)</label><input id="r_p" type="password" autocomplete="new-password">
  <div class="err" id="r_e"></div><div class="row"><button id="r_s">Recover</button><button class="sec" id="r_c">Cancel</button></div>`);
  $("#r_c").onclick = () => o.remove();
  $("#r_s").onclick = () => busy($("#r_s"), $("#r_e"), async () => {

  });
}
function openUsers() {
  const o = modal(`<h1>Users</h1>
  ${members().map(u => `<div class="zone" style="margin-bottom:8px"><b>${esc(u.name)}</b> <span class="meta">member</span><div class="meta">${esc(u.email || "no email")}</div>
    <div class="row" style="margin-top:8px"><button class="sm sec" data-pf="${u.id}">Edit</button><button class="sm sec" data-r="${u.id}">Reset password</button><button class="sm sec" data-d="${u.id}">Delete</button></div></div>`).join("") || '<div class="st">No members yet.</div>'}
  <h1 style="margin-top:16px">Add member</h1>
  <label>Name (shown in the app)</label><input id="n_n" autocomplete="off" maxlength="30">
  <label>Email</label><input id="n_m" type="email" autocomplete="off" autocapitalize="off">
  <label>Initial password (at least 8 characters; the member can change it)</label>
  <div class="row"><input id="n_p" autocomplete="off"><button class="sec" id="n_g" type="button">Generate</button></div>
  <div class="err" id="n_e"></div><div class="row"><button id="n_a">Add</button><button class="sec" id="n_x">Close</button></div>`);
  $("#n_x").onclick = () => o.remove();
  $("#n_g").onclick = () => { $("#n_p").value = genPass(14); };
  $("#n_a").onclick = () => busy($("#n_a"), $("#n_e"), async () => {
    const n = $("#n_n").value, em = $("#n_m").value, p = $("#n_p").value; $("#n_a").textContent = "Creating…";
    await addUser(n, em, p); o.remove(); toast(`User created. Initial password: ${p}`); openUsers();
  }).then(ok => { if (!ok) $("#n_a").textContent = "Add"; });
  o.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { o.remove(); openProfile(b.dataset.pf); });
  o.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => {
    const u = userById(b.dataset.r), p = prompt(`New password for ${u.name} (at least 8 characters):`, genPass(14));
    if (!p) return; b.disabled = true;
    try { await resetUser(u.id, p); toast(`Password reset for ${u.name}`); } catch (e) { alert(e.message); }
    b.disabled = false;
  });
  o.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    const u = userById(b.dataset.d);
    if (!confirm(`Delete user ${u.name}? They lose access to all passwords.`)) return;
    b.disabled = true; try { await removeUser(u.id); o.remove(); openUsers(); renderList(); } catch (e) { alert(e.message); b.disabled = false; }
  });
}
function openCats() {
  const counts = new Map(); for (const e of visible()) { const c = catOf(e.d); counts.set(c, (counts.get(c) || 0) + 1); }
  const o = modal(`<h1>Categories</h1>
  ${catList().map(c => `<div class="zone" style="margin-bottom:8px"><b>${esc(c.name)}</b> <span class="meta">${counts.get(c.id) || 0} ${(counts.get(c.id) || 0) === 1 ? "entry" : "entries"}</span>
    ${c.id === GENERAL ? '<div class="meta" style="margin-top:6px">Default category, cannot be deleted.</div>' : `<div class="row" style="margin-top:8px"><button class="sm sec" data-rn="${c.id}">Rename</button><button class="sm sec" data-dc="${c.id}">Delete</button></div>`}</div>`).join("")}
  <h1 style="margin-top:16px">Add category</h1>
  <input id="k_n" autocomplete="off" maxlength="40" placeholder="Category name">
  <div class="err" id="k_e"></div><div class="row"><button id="k_a">Add</button><button class="sec" id="k_x">Close</button></div>`);
  $("#k_x").onclick = () => o.remove();
  const again = () => { o.remove(); openCats(); renderList(); };
  $("#k_a").onclick = () => busy($("#k_a"), $("#k_e"), async () => { await addCat($("#k_n").value); again(); });
  o.querySelectorAll("[data-rn]").forEach(b => b.onclick = async () => {
    const c = catList().find(x => x.id === b.dataset.rn), n = prompt("New name:", c.name); if (!n) return;
    try { await renCat(c.id, n); again(); } catch (e) { alert(e.message); }
  });
  o.querySelectorAll("[data-dc]").forEach(b => b.onclick = async () => {
    const c = catList().find(x => x.id === b.dataset.dc), n = counts.get(c.id) || 0;
    if (!confirm(`Delete category "${c.name}"?${n ? ` The ${n} ${n === 1 ? "entry stays" : "entries stay"} and ${n === 1 ? "moves" : "move"} to General.` : ""}`)) return;
    try { await delCat(c.id); again(); } catch (e) { alert(e.message); }
  });
}
function openConn() {
  const code = btoa(JSON.stringify({ r: CFG.repo, t: CFG.token }));
  const o = modal(`<h1>GitHub connection</h1>
  <label>Data repo</label><input id="g_r" value="${esc(CFG.repo)}" autocapitalize="off" autocomplete="off">
  <label>New token (leave empty to keep the current one)</label><input id="g_t" type="password" autocomplete="off" placeholder="github_pat_...">
  <div class="err" id="g_e"></div><button id="g_s">Save connection</button>
  <h1 style="margin-top:18px">Activation code</h1>
  <p class="meta">Members paste it once on a new device, before signing in. It contains the token: send it only over a secure channel.</p>
  <textarea id="g_c" rows="3" readonly>${esc(code)}</textarea>
  <div class="row"><button class="sec" id="g_cp">${ic("copy")} Copy code</button><button class="sec" id="g_x">Close</button></div>`);
  $("#g_x").onclick = () => o.remove();
  $("#g_cp").onclick = () => copy(code, "Code copied");
  $("#g_s").onclick = () => busy($("#g_s"), $("#g_e"), async () => {
    const old = { ...CFG };
    try { await checkCfg($("#g_r").value, $("#g_t").value.trim() || old.token); }
    catch (e) { CFG = old; throw e; }
    o.remove(); toast("Connection saved"); refresh();

/* ---------- CSV export ---------- */
function buildCsv(sep) {
  const adm = isAdmin();
  const head = ["category", "tags", "title", "url", "username", "password", "notes", "created_by", "created_at", "modified_by", "modified_at", ...(adm ? ["visible_to"] : [])];
  const rows = visible().sort((a, b) => cmp(catName(catOf(a.d)), catName(catOf(b.d))) || cmp(a.d.title || "", b.d.title || ""))
    .map(e => { const d = e.d; return [catName(catOf(d)), (d.tags || []).join(" "), d.title, d.url, d.user, d.pass, d.notes, d.createdBy, isoLocal(d.created), d.updatedBy, isoLocal(d.updated),
      ...(adm ? [Object.keys(e.rec.k).map(i => (userById(i) || { name: "?" }).name).join(" / ")] : [])]; });
  const cell = v => { const s = String(v ?? ""); return (s.includes(sep) || /["\r\n]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return "﻿" + [head, ...rows].map(r => r.map(cell).join(sep)).join("\r\n") + "\r\n";
}
function openExport() {
  const o = modal(`<h1>Export CSV</h1>
  <p class="warn">The file contains the passwords ${isAdmin() ? "of all entries" : "you can see"} in plain text. Keep it somewhere safe and delete it after use.</p>
  <label>Separator</label><select id="x_sep"><option value=";">semicolon (Excel, European locales)</option><option value=",">comma (standard)</option></select>
  <label>Confirm your password</label><input id="x_pw" type="password" autocomplete="current-password">
  <div class="err" id="x_e"></div><div class="row"><button id="x_go">Download CSV</button><button class="sec" id="x_c">Cancel</button></div>`);
  $("#x_c").onclick = () => o.remove();
  const go = () => busy($("#x_go"), $("#x_e"), async () => {
    try { await unwrapPw(me().w, $("#x_pw").value); } catch (e) { throw new Error("Wrong password."); }
    const blob = new Blob([buildCsv($("#x_sep").value)], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "vault-" + isoLocal(Date.now()).slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    o.remove(); toast("CSV downloaded");
  });
  $("#x_go").onclick = go; $("#x_pw").onkeydown = e => { if (e.key === "Enter") go(); };
  $("#x_pw").focus();
}

/* ---------- auto-lock ---------- */
let lockTimer, hiddenAt = 0;
function armLock() { clearTimeout(lockTimer); if (S.priv) lockTimer = setTimeout(() => logout(), LOCK_MS); }
["click", "keydown", "touchstart", "mousemove"].forEach(ev => addEventListener(ev, armLock, { passive: true }));
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (S.priv) { if (Date.now() - hiddenAt > LOCK_MS) logout(); else refresh(); }
});
addEventListener("online", () => { if (S.priv) refresh(); });

init();
</script>
